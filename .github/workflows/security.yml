name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The newest Go: its standard library is the one users should build
      # with, and the scan covers both it and the dependencies.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
