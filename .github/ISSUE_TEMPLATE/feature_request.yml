name: Feature request
description: Suggest an improvement or a missing feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How the API or behavior could look.
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does upstream Pi Durable have it?
      options:
        - "Yes: it is a missing port"
        - "No: it would be specific to Go"
        - "I don't know"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.
