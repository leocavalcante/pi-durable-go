version: 2
updates:
  # Go modules. CI builds with GOTOOLCHAIN=local on the minimum Go, so an
  # update that needs a newer Go fails there; raise the minimum deliberately.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
